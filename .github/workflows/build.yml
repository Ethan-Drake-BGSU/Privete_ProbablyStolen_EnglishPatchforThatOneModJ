name: Build JCuratedVisitors English Patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'JCuratedVisitorsEnglishPatch_GitHub_Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 6 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Extract source archive
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'JCuratedVisitorsEnglishPatch_GitHub_Source.zip') -DestinationPath $sourceRoot -Force
          $project = Join-Path $sourceRoot 'JCuratedVisitorsEnglishPatch_v2\JCuratedVisitorsEnglishPatch.csproj'
          if (-not (Test-Path $project)) { throw "Project file not found: $project" }
          "PROJECT_PATH=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore and compile
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_PATH"
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }
          $buildOut = Join-Path $env:GITHUB_WORKSPACE 'dist\build'
          New-Item -ItemType Directory -Force -Path $buildOut | Out-Null
          dotnet build "$env:PROJECT_PATH" --configuration Release --no-restore --output $buildOut
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }

      - name: Create install ZIP
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'dist\package'
          $mods = Join-Path $package 'Mods'
          $userdata = Join-Path $package 'UserData\JCuratedVisitorsEnglishPatch'
          New-Item -ItemType Directory -Force -Path $mods, $userdata | Out-Null
          $dll = Join-Path $env:GITHUB_WORKSPACE 'dist\build\JCuratedVisitorsEnglishPatch.dll'
          $json = Join-Path $env:SOURCE_ROOT 'JCuratedVisitorsEnglishPatch_v2\Translations\en.json'
          if (-not (Test-Path $dll)) { throw "Build output DLL not found: $dll" }
          if (-not (Test-Path $json)) { throw "Translation file not found: $json" }
          Copy-Item -LiteralPath $dll -Destination $mods
          Copy-Item -LiteralPath $json -Destination (Join-Path $userdata 'en.json')
          @'
          JCuratedVisitors English Patch — diagnostic prototype

          Install by extracting this ZIP into the Probably Stolen Demo game folder.
          It adds Mods/JCuratedVisitorsEnglishPatch.dll and UserData/JCuratedVisitorsEnglishPatch/en.json.
          Do not replace the original Mods/JCuratedVisitors.dll.
          If the game crashes, remove only Mods/JCuratedVisitorsEnglishPatch.dll.
          This prototype is not yet verified as a complete translation.
          '@ | Set-Content -LiteralPath (Join-Path $package 'README.txt') -Encoding utf8
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dist\JCuratedVisitors-English-Patch.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -Force

      - name: Upload downloadable patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: JCuratedVisitors-English-Patch
          path: dist/JCuratedVisitors-English-Patch.zip
          if-no-files-found: error
          retention-days: 7

